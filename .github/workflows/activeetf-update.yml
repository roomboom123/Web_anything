name: Update Active ETF Changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activeetf-update.yml"
      - "tools/activeetf/**"
  schedule:
    # 08:00 and 20:00 KST. WiseReport publishes CU holdings with about a one-day lag,
    # and re-collecting the same trade date simply overwrites that day's snapshot.
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"

permissions:
  contents: write

concurrency:
  group: activeetf-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect holdings and rebuild changes
        run: python tools/activeetf/update_data.py --data-dir activeetf/data

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activeetf/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update active ETF changes"
          git pull --rebase origin main
          git push
